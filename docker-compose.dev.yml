# Development overrides for docker compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      # Hot-reload: mount source code so changes reflect immediately
      - .:/app
      # Persist air's build cache outside the container to avoid permission issues
      - air-cache:/root/.cache
    # air is the default CMD in Dockerfile.dev