services:
  db:
    image: postgres:16-alpine
    container_name: universev2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universev2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_MAP:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    container_name: universev2-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT_MAP:-8080}:${APP_PORT:-8080}"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      APP_NAME: ${APP_NAME:-universev2-backend}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-universev2}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-25}
      DB_MIN_POOL_SIZE: ${DB_MIN_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-168h}
      FINGERPRINT_PORT: ${FINGERPRINT_PORT:-/dev/ttyUSB0}
      FINGERPRINT_BAUD: ${FINGERPRINT_BAUD:-115200}
      FINGERPRINT_ENABLED: ${FINGERPRINT_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APP_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  air-cache:
